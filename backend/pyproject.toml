[project]
name = "dataforge-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = ["data", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line length; rely on the formatter
    "B008", # FastAPI dependency injection uses call expressions in defaults
]

[tool.ruff.lint.per-file-ignores]
"main.py" = [
    "E402", # load .env before other local modules read os.environ
]
"test_*.py" = [
    "E402", # tests isolate the database before importing app modules
    "SIM117", # nested with blocks are fine in tests
]

# First-party modules are detected from `src` above, so they need no explicit list.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"