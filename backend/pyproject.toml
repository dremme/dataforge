[project]
name = "dataforge-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
exclude = ["data", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line length; rely on the formatter
    "B008", # FastAPI dependency injection uses call expressions in defaults
]

[tool.ruff.lint.per-file-ignores]
"main.py" = [
    "E402", # load .env before other local modules read os.environ
]
"test_*.py" = [
    "E402", # tests isolate the database before importing app modules
    "SIM117", # nested with blocks are fine in tests
]

# First-party modules are detected from `src` above, so they need no explicit list.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
# Pinned, not inferred: CI checks the backend under both 3.12 and 3.13 and the two must agree.
python-version = "3.12"

[tool.ty.src]
exclude = ["data", "__pycache__"]

[tool.ty.rules]
# FastAPI's Query()/Depends() defaults are the documented way to declare a parameter, and ruff
# already exempts them through B008.
invalid-parameter-default = "ignore"

[[tool.ty.overrides]]
include = ["**/test_*.py"]

# Tests assert into the `dict[str, object]` a job returns, so these fire on nearly every
# assertion rather than on anything wrong. Narrowing that return type is what would let them back.
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-iterable = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
