name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_VERSION: "7.1.5"
  FFMPEG_SHA256: "de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Set up pinned FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          version: ${{ env.FFMPEG_VERSION }}
          sha256: ${{ env.FFMPEG_SHA256 }}

      - name: Verify the application's FFmpeg version
        run: backend/.venv/bin/python scripts/check_ffmpeg.py "$FFMPEG_VERSION"

      - name: Run backend checks
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/run_checks.py --scope backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/run_checks.py --scope frontend

  # Kept out of run_checks.py, which is the pre-commit hook: this boots two servers
  # and a browser. It runs here and on demand via `npm run test:e2e`.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Set up pinned FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          version: ${{ env.FFMPEG_VERSION }}
          sha256: ${{ env.FFMPEG_SHA256 }}

      # types.ts is generated and not checked in, so the dev server cannot build without it.
      - name: Generate frontend API types
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/generate_types.py

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify the application's FFmpeg version
        run: backend/.venv/bin/python scripts/check_ffmpeg.py "$FFMPEG_VERSION"

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
