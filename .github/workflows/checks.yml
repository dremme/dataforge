name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # Report every version rather than cancelling siblings on the first failure:
      # a divergence is only diagnosable by comparing the legs against each other.
      fail-fast: false
      matrix:
        # 3.12 is the deployment baseline, 3.13 is what development runs on.
        # Standard-library behaviour differs between them (e.g. pathlib.Path.iterdir
        # is a generator on 3.12 but scans eagerly on 3.13), so both are exercised.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Run backend checks
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/run_checks.py --scope backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/src/shared/types.ts is generated from backend/schemas.py and is not
      # checked in, so the frontend cannot typecheck, test, or build without a backend
      # venv to generate it first. One version is enough: the generated output does not
      # depend on the Python version, so this job stays off the backend's matrix.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/run_checks.py --scope frontend

  # Kept out of run_checks.py, which is the pre-commit hook: this boots two servers
  # and a browser. It runs here and on demand via `npm run test:e2e`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      # types.ts is generated and not checked in, so the dev server cannot build without it.
      - name: Generate frontend API types
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/generate_types.py

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
