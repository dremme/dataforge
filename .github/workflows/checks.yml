name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # Report every version rather than cancelling siblings on the first failure:
      # a divergence is only diagnosable by comparing the legs against each other.
      fail-fast: false
      matrix:
        # 3.12 is the deployment baseline, 3.13 is what development runs on.
        # Standard-library behaviour differs between them (e.g. pathlib.Path.iterdir
        # is a generator on 3.12 but scans eagerly on 3.13), so both are exercised.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Run backend checks
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/run_checks.py --scope backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/src/shared/types.ts is generated from backend/schemas.py and is not
      # checked in, so the frontend cannot typecheck, test, or build without a backend
      # venv to generate it first. One version is enough: the generated output does not
      # depend on the Python version, so this job stays off the backend's matrix.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend venv and install deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks
        env:
          DATAFORGE_DISABLE_DOTENV: "1"
        run: backend/.venv/bin/python scripts/run_checks.py --scope frontend
